name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only reads the checked-out code.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. a new push to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.6.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail early if workerd/esbuild are no longer covered by package.json
      # `allowScripts` — npm v12 would then block those install scripts and break the
      # dev container. Keyed by name, so version bumps don't trip it; this guards
      # against the packages leaving the tree. See scripts/check-allowscripts.mjs.
      - name: Verify allowScripts allowlist
        run: npm run check:allowscripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
